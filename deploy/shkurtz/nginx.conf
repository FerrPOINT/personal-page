limit_req_zone $binary_remote_addr zone=personal_page_contact:10m rate=5r/m;

server {
    listen 80;
    server_name azhukov-dev.ru www.azhukov-dev.ru;
    return 301 https://azhukov-dev.ru$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.azhukov-dev.ru;
    ssl_certificate /etc/letsencrypt/live/azhukov-dev.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/azhukov-dev.ru/privkey.pem;
    return 301 https://azhukov-dev.ru$request_uri;
}

server {
    listen 443 ssl http2;
    server_name azhukov-dev.ru;
    server_tokens off;
    client_max_body_size 64k;
    limit_req_status 429;

    ssl_certificate /etc/letsencrypt/live/azhukov-dev.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/azhukov-dev.ru/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /api/contact {
        if ($request_method != POST) { return 404; }
        limit_req zone=personal_page_contact burst=5 nodelay;
        proxy_pass http://127.0.0.1:19000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    error_page 413 = @contact_413;
    location @contact_413 {
        default_type application/json;
        return 413 '{"success":false,"error":{"code":"PAYLOAD_TOO_LARGE","message":"Тело запроса слишком большое"},"requestId":"$request_id"}';
    }

    error_page 429 = @contact_429;
    location @contact_429 {
        default_type application/json;
        return 429 '{"success":false,"error":{"code":"RATE_LIMITED","message":"Слишком много запросов. Попробуйте позже."},"requestId":"$request_id"}';
    }

    location = /live { return 404; }
    location = /ready { return 404; }
    location = /api { return 404; }
    location ^~ /api/ { return 404; }

    location / {
        proxy_pass http://127.0.0.1:18888;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
