    <circle cx="1288" cy="42" r="1.05" opacity=".77"/><circle cx="1398" cy="112" r=".7" opacity=".5"/><circle cx="1502" cy="60" r=".9" opacity=".72"/>
    <circle cx="58" cy="328" r=".65" opacity=".52"/><circle cx="232" cy="375" r=".95" opacity=".68"/><circle cx="470" cy="354" r=".55" opacity=".48"/>
    <circle cx="719" cy="336" r=".78" opacity=".7"/><circle cx="850" cy="386" r=".55" opacity=".52"/><circle cx="1000" cy="350" r="1" opacity=".73"/>
    <circle cx="1272" cy="362" r=".72" opacity=".55"/><circle cx="1458" cy="328" r="1.1" opacity=".72"/><circle cx="1552" cy="392" r=".62" opacity=".6"/>
