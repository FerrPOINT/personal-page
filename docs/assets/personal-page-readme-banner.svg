    <path d="M1261 257l16-13 7 5-16 12z" fill="#f000d5"/>
    <circle cx="1014" cy="309" r="3.5" fill="#00d9ff"/>
  </g>

  <g transform="translate(88 94)">
    <rect x="0" y="0" width="254" height="30" rx="15" fill="#00d9ff" fill-opacity=".09" stroke="#00d9ff" stroke-opacity=".48"/>
    <circle cx="18" cy="15" r="4" fill="#00d9ff" filter="url(#accentGlow)"/>
    <text x="32" y="20" fill="#8beaff" font-family="'Fira Code', monospace" font-size="12" font-weight="600" letter-spacing="1.2">FULL-STACK / TYPESCRIPT</text>
    <text x="0" y="108" fill="#f6f7ff" font-family="Inter, Arial, sans-serif" font-size="48" font-weight="760" letter-spacing="-1">ПЕРСОНАЛЬНАЯ</text>
    <text x="0" y="164" fill="url(#name)" font-family="Inter, Arial, sans-serif" font-size="54" font-weight="780" letter-spacing="-1.5">СТРАНИЦА</text>
