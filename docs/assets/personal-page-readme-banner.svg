<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="420" viewBox="0 0 1600 420" role="img" aria-labelledby="title desc">
  <title id="title">Персональная страница — full-stack проект на TypeScript</title>
  <desc id="desc">React frontend и Node.js backend на одном языке, в космическом визуальном стиле персональной страницы</desc>
  <defs>
    <radialGradient id="space" cx="78%" cy="53%" r="78%">
      <stop offset="0" stop-color="#171139"/>
      <stop offset="0.46" stop-color="#0b0c20"/>
      <stop offset="1" stop-color="#06070d"/>
    </radialGradient>
    <radialGradient id="sun" cx="34%" cy="28%" r="70%">
      <stop offset="0" stop-color="#ffe29a"/>
      <stop offset="0.38" stop-color="#ffbf4f"/>
      <stop offset="1" stop-color="#e86618"/>
    </radialGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00d9ff"/>
      <stop offset="0.52" stop-color="#6d63ff"/>
      <stop offset="1" stop-color="#f000d5"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00d9ff"/>
      <stop offset="1" stop-color="#f000d5"/>
    </linearGradient>
    <filter id="sunGlow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="19" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="accentGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="sunClip"><circle cx="1115" cy="214" r="54"/></clipPath>
  </defs>

  <rect width="1600" height="420" fill="url(#space)"/>
  <rect width="720" height="420" fill="url(#leftFade)" opacity=".34"/>
  <defs><linearGradient id="leftFade" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#06070d"/><stop offset="1" stop-color="#06070d" stop-opacity="0"/></linearGradient></defs>

  <g fill="#eaf9ff">
