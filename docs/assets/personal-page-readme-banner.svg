    <text x="0" y="230" fill="#acb4c7" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="500">React frontend и Node.js backend</text>
    <text x="0" y="258" fill="#acb4c7" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="500">реализованы на одном языке — TypeScript.</text>
    <text x="0" y="288" fill="#7f899d" font-family="'Fira Code', monospace" font-size="13" letter-spacing=".2">React 19  /  Vite  /  Express  /  SQLite</text>
